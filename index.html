<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boas-vindas</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #2563eb, #7dd3fc);
        color: #f8fafc;
      }
      .card {
        width: min(90vw, 700px);
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        padding: 48px 32px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }
      p {
        margin: 0 0 24px;
        font-size: 1.1rem;
        line-height: 1.7;
        color: #dbeafe;
      }
      .btn {
        display: inline-block;
        padding: 14px 28px;
        text-decoration: none;
        background: #facc15;
        color: #111827;
        border-radius: 999px;
        font-weight: bold;
        transition: transform 0.2s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bem-vindo!</h1>
      <p>
        É um prazer ter você por aqui. Aproveite sua visita e descubra tudo o que
        este espaço tem a oferecer.
      </p>
      <a href="#" class="btn">Começar</a>
    </div>
  </body>
</html>
